name: Actualizar resultados lotería

on:
  schedule:
    # Evita el pico del :00; corre cada 10 min exactos (UTC)
    - cron: "2,12,22,32,42,52 * * * *"

  workflow_dispatch: {}

  repository_dispatch:
    types: [kick]

permissions:
  contents: write

concurrency:
  group: scraper-production
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: "America/Santo_Domingo"
      TARGET_API_PATH: "docs/resultados_combinados.json"

    steps:
      - name: Checkout repo (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Timestamps (UTC y RD)
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.event.schedule=${{ github.event.schedule }}"
          date -u +"UTC  %Y-%m-%d %H:%M:%S"
          TZ="America/Santo_Domingo" date +"RD   %Y-%m-%d %H:%M:%S"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Instalar dependencias Python
        run: |
          set -euxo pipefail

          python -V
          python -m pip install --upgrade pip

          pip install \
            playwright \
            beautifulsoup4 \
            requests \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

          if [ -f scraper/requirements.txt ]; then
            pip install -r scraper/requirements.txt
          fi

      - name: Instalar Playwright + Chromium
        run: |
          set -euxo pipefail
          python -m playwright install --with-deps chromium

      # main.py utiliza este archivo como histórico anterior.
      - name: Preparar histórico local para scraper
        run: |
          set -euxo pipefail

          if [ -f "${{ env.TARGET_API_PATH }}" ]; then
            cp -f \
              "${{ env.TARGET_API_PATH }}" \
              resultados_combinados.json

            echo "✅ Histórico copiado a resultados_combinados.json"
          else
            echo "⚠️ No existe histórico previo."
            echo "El scraper generará resultados_combinados.json desde cero."
          fi

      - name: Ejecutar scraper + FCM
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euxo pipefail

          xvfb-run -a python scraper/main.py

          echo "✅ Scraper terminado correctamente."

      # ---------------------------------------------------------
      # BLINDAJE 1
      # main.py DEBE haber producido un JSON válido.
      # ---------------------------------------------------------
      - name: Validar salida del scraper
        run: |
          set -euxo pipefail

          python - <<'PY'
          import json
          import pathlib
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = pathlib.Path("resultados_combinados.json")

          print(f"🔎 Validando: {path}")

          if not path.exists():
              print("❌ resultados_combinados.json NO existe.")
              sys.exit(1)

          if path.stat().st_size < 10:
              print(
                  f"❌ resultados_combinados.json es demasiado pequeño: "
                  f"{path.stat().st_size} bytes"
              )
              sys.exit(1)

          try:
              obj = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except Exception as e:
              print(f"❌ JSON inválido: {repr(e)}")
              sys.exit(1)

          if not isinstance(obj, dict):
              print("❌ El JSON raíz debe ser un objeto.")
              sys.exit(1)

          resultados = obj.get("resultados")

          if not isinstance(resultados, list):
              print("❌ El campo 'resultados' no es una lista.")
              sys.exit(1)

          if len(resultados) == 0:
              print("❌ El JSON contiene 0 resultados.")
              sys.exit(1)

          requeridos = {
              "loteria",
              "numeros",
              "fecha"
          }

          invalidos = []

          for i, resultado in enumerate(resultados):
              if not isinstance(resultado, dict):
                  invalidos.append(
                      (i, "registro no es objeto")
                  )
                  continue

              faltantes = [
                  campo
                  for campo in requeridos
                  if campo not in resultado
              ]

              if faltantes:
                  invalidos.append(
                      (
                          i,
                          "faltan: " + ",".join(faltantes)
                      )
                  )
                  continue

              numeros = resultado.get("numeros")

              if not isinstance(numeros, list):
                  invalidos.append(
                      (i, "numeros no es lista")
                  )

          if invalidos:
              print(
                  f"❌ Se encontraron "
                  f"{len(invalidos)} registros inválidos."
              )

              for item in invalidos[:10]:
                  print(
                      f"   índice={item[0]} "
                      f"problema={item[1]}"
                  )

              sys.exit(1)

          tz_rd = ZoneInfo(
              "America/Santo_Domingo"
          )

          hoy = datetime.now(
              tz_rd
          ).strftime("%Y-%m-%d")

          de_hoy = [
              r
              for r in resultados
              if str(
                  r.get("fecha", "")
              ).strip() == hoy
          ]

          print(
              f"✅ JSON válido: "
              f"{len(resultados)} registros totales."
          )

          print(
              f"📅 Registros correspondientes "
              f"a HOY ({hoy}): {len(de_hoy)}"
          )

          print(
              f"🕐 generado: "
              f"{obj.get('generado')}"
          )

          # main.py ya valida esto,
          # pero esta es una segunda barrera.
          if len(de_hoy) == 0:
              print(
                  "❌ El JSON no contiene ningún "
                  "resultado de hoy."
              )
              sys.exit(1)

          print("✅ Guardrail del scraper superado.")
          PY

      # ---------------------------------------------------------
      # YA NO HACEMOS OTRO MERGE.
      #
      # main.py:
      #   histórico
      #      +
      #   resultados nuevos
      #      +
      #   dedupe
      #      ↓
      # resultados_combinados.json
      #
      # GitHub simplemente publica ESA salida.
      # ---------------------------------------------------------
      - name: Publicar API
        run: |
          set -euxo pipefail

          python - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import sys

          src = pathlib.Path(
              "resultados_combinados.json"
          )

          target = pathlib.Path(
              "${{ env.TARGET_API_PATH }}"
          )

          if not src.exists():
              print(
                  "❌ No existe la salida "
                  "resultados_combinados.json"
              )
              sys.exit(1)

          # Validación adicional antes de publicar.
          try:
              obj = json.loads(
                  src.read_text(
                      encoding="utf-8"
                  )
              )
          except Exception as e:
              print(
                  f"❌ No se puede publicar "
                  f"un JSON inválido: {repr(e)}"
              )
              sys.exit(1)

          resultados = obj.get(
              "resultados",
              []
          )

          if not resultados:
              print(
                  "❌ No se publicará una API "
                  "sin resultados."
              )
              sys.exit(1)

          target.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          tmp = target.with_suffix(
              target.suffix + ".tmp"
          )

          shutil.copyfile(
              src,
              tmp
          )

          # Confirma que la copia sigue siendo válida.
          try:
              verificacion = json.loads(
                  tmp.read_text(
                      encoding="utf-8"
                  )
              )
          except Exception as e:
              try:
                  tmp.unlink()
              except OSError:
                  pass

              print(
                  f"❌ La copia temporal "
                  f"resultó inválida: {repr(e)}"
              )
              sys.exit(1)

          if not verificacion.get(
              "resultados"
          ):
              try:
                  tmp.unlink()
              except OSError:
                  pass

              print(
                  "❌ La copia temporal "
                  "no contiene resultados."
              )
              sys.exit(1)

          # Reemplazo atómico.
          os.replace(
              tmp,
              target
          )

          print(
              f"✅ API publicada en {target}"
          )

          print(
              f"📦 Total publicado: "
              f"{len(verificacion['resultados'])}"
          )
          PY

      # ---------------------------------------------------------
      # BLINDAJE 2
      # Comprueba exactamente lo que quedará en /docs.
      # ---------------------------------------------------------
      - name: Verificar API publicada
        run: |
          set -euxo pipefail

          python - <<'PY'
          import json
          import pathlib
          import sys

          target = pathlib.Path(
              "${{ env.TARGET_API_PATH }}"
          )

          if not target.exists():
              print(
                  f"❌ No existe {target}"
              )
              sys.exit(1)

          try:
              obj = json.loads(
                  target.read_text(
                      encoding="utf-8"
                  )
              )
          except Exception as e:
              print(
                  f"❌ API publicada inválida: "
                  f"{repr(e)}"
              )
              sys.exit(1)

          resultados = obj.get(
              "resultados",
              []
          )

          if not resultados:
              print(
                  "❌ API publicada vacía."
              )
              sys.exit(1)

          print(
              f"✅ API final verificada."
          )

          print(
              f"📊 Registros: "
              f"{len(resultados)}"
          )

          print(
              f"🕐 Generado: "
              f"{obj.get('generado')}"
          )

          print("🔎 Últimos 5 registros:")

          for r in resultados[-5:]:
              print(
                  f"   {r.get('loteria')} | "
                  f"{r.get('numeros')} | "
                  f"{r.get('fecha')} | "
                  f"{r.get('hora')}"
              )
          PY

      - name: Guardrail - no commitear workflows
        run: |
          set -e

          if git diff --name-only | grep -qE '^\.github/workflows/'; then
            echo "⚠️ Cambio inesperado en workflows. Restaurando..."
            git checkout -- .github/workflows
          fi

          if git diff --cached --name-only | grep -qE '^\.github/workflows/'; then
            echo "::error::Se detectaron workflows en el stage. Abortando push."
            exit 1
          fi

      - name: Commit & push (API + sent_cache)
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git fetch origin main

          git reset --soft origin/main

          git add -f "${{ env.TARGET_API_PATH }}"

          if [ -f sent_cache.json ]; then
            git add -f sent_cache.json
          fi

          if git diff --cached --quiet; then
            echo "✅ Nada nuevo que commitear."
            exit 0
          fi

          echo "📋 Archivos que serán publicados:"
          git diff --cached --name-only

          git commit \
            -m "chore: actualizar API ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"

          if ! git push origin HEAD:main; then
            echo "⚠️ Push rechazado. Reintentando sobre main actualizado..."

            git fetch origin main

            git reset --soft origin/main

            git add -f "${{ env.TARGET_API_PATH }}"

            if [ -f sent_cache.json ]; then
              git add -f sent_cache.json
            fi

            git commit \
              -m "chore: actualizar API (retry $(date -u +'%Y-%m-%dT%H:%M:%SZ'))" \
              || true

            git push origin HEAD:main
          fi
